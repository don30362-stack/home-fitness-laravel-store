# Activate only after both certificate files exist and nginx -t succeeds.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 80;
    server_name homefit-store.ddnsfree.com;
    server_tokens off;
    if ($http_host !~* "^homefit-store\.ddnsfree\.com(?::80)?$") { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://homefit-store.ddnsfree.com$request_uri; }
}

# Unknown SNI/hosts must not reach the application.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name homefit-store.ddnsfree.com;
    if ($http_host !~* "^homefit-store\.ddnsfree\.com(?::443)?$") { return 444; }
    ssl_certificate /etc/letsencrypt/live/homefit-store.ddnsfree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homefit-store.ddnsfree.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api { rewrite ^ /index.php last; }
    location ^~ /api/ { rewrite ^ /index.php last; }
    location = /sanctum { rewrite ^ /index.php last; }
    location ^~ /sanctum/ { rewrite ^ /index.php last; }
    location = /up { rewrite ^ /index.php last; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Set by this TLS endpoint, never by a client-supplied forwarded header.
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 30s;
    }
    location ~* ^/storage/(?:products/[0-9]+/|banners/)[A-Za-z0-9_-]+\.(?:jpe?g|png|webp)$ {
        try_files $uri =404;
    }
    location /storage/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
# Container-local health endpoint only; port 8080 is never published.
server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1;
    server_tokens off;
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST homefit-store.ddnsfree.com;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 10s;
    }
    location / { return 404; }
}
